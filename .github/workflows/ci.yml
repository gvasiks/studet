name: CI

on:
  push:
    branches: [master]
  pull_request:

# Права токена GitHub заданы явно: без этой строки они зависят от настроек
# репозитория и могут оказаться шире нужного (аудит 2026-10-04).
permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run check:static-budget
      - run: npm run check:glossary-terms
      # NEXT_PUBLIC_* — publishable anon key, ограничения через RLS,
      # не service_role (CLAUDE.md, A02). Сборка требует их на этапе
      # build, не только runtime — без них src/lib/supabase.ts падает.
      # NEXT_PUBLIC_PREVIEW_COUNTRIES — страны, которые ещё строятся (Литва):
      # в проверочной сборке их адреса включены, чтобы аудит доступности
      # видел и их. На рабочей выкладке переменная не задаётся.
      - run: npm run build
        env:
          NEXT_PUBLIC_PREVIEW_COUNTRIES: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Только Chromium (не все три движка) — раздел 15 ревью 2026-09,
      # runtime-аудит доступности (axe-core) поверх уже собранного .next
      # из шага выше, "npm run start" его не пересобирает.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          NEXT_PUBLIC_PREVIEW_COUNTRIES: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Самопроверки конвейера (pipeline/src/run_selftests.py): разбор документов
  # и страниц на сохранённых образцах, без базы и сети. Раньше запускались
  # только руками — поломка разборщика была видна в ночь сбора.
  pipeline-selftests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      # браузер Playwright не ставится: самопроверки страниц не открывают
      - run: pip install -r requirements.txt
      - run: python src/run_selftests.py
