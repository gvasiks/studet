name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run check:static-budget
      - run: npm run check:glossary-terms
      # NEXT_PUBLIC_* — publishable anon key, ограничения через RLS,
      # не service_role (CLAUDE.md, A02). Сборка требует их на этапе
      # build, не только runtime — без них src/lib/supabase.ts падает.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Только Chromium (не все три движка) — раздел 15 ревью 2026-09,
      # runtime-аудит доступности (axe-core) поверх уже собранного .next
      # из шага выше, "npm run start" его не пересобирает.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
