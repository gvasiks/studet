name: Scrape Lithuania

# Литовские данные собираются отдельно от недельного латвийского сбора
# (docs/PLAN-LITHUANIA-2027.md, фаза 6): сбой литовского реестра не должен
# красить латвийский прогон, и наоборот. Источники меняются редко — список
# программ раз в год (к 15 апреля), правила балла раз в год (к 1 декабря), —
# поэтому обычный ритм — раз в месяц, а в сезон приёма (июнь–август) — раз
# в неделю: вузы могут снимать программы с приёма до последних дней.
#
# Расписание оставлено по решению владельца (2026-10-10), хотя реестр
# aikos.smm.lt серверу GitHub отвечает ненадёжно: из пяти прогонов 9–10
# октября 2026 года два прошли, один упал на не ответившей странице, один —
# на тридцати неполных карточках, один не уложился в два с половиной часа.
# Поэтому упавший прогон здесь — обычное дело, а не авария:
#   - базу он не портит: неполный каталог не записывается, а после 30
#     повторных запросов сборщик останавливается сам;
#   - следующий прогон по расписанию может пройти;
#   - если данные нужны сейчас — сбор с компьютера владельца, в папке pipeline:
#       .venv\Scripts\python.exe src\lt_refresh.py
# Если данные не обновлялись 45 дней, об этом напомнит lithuania-health.yml.
on:
  schedule:
    # 3-е число каждого месяца, 02:30 UTC — ночь, не понедельник латвийского
    # сбора (01:00) и не 2-е число обхода NIID
    - cron: "30 2 3 * *"
    # каждый четверг в июне–августе — сезон приёма
    - cron: "30 2 * 6-8 4"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # реестр — 637 карточек с паузой 3 с: около часа на обход, плюс до
    # получаса на повторы — после 30 повторов сборщик останавливается сам
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
      # Каталог и формулы читают одни и те же карточки реестра: с кэшем
      # второй шаг берёт их с диска, а не обходит реестр второй раз.
      SCRAPE_CACHE: "1"
      # Пауза между страницами вдвое больше обычной (1,5 с): на прогоне
      # 2026-10-10 реестр отдал серверу GitHub около тридцати карточек
      # неполными. Спешить некуда — сбор идёт ночью раз в месяц.
      SCRAPE_DELAY_SECONDS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      # 1. Каталог: программы и вузы.
      - name: Каталог
        run: python src/main.py lt_lamabpo

      # 2. Строки приёма, государственные коды и формулы балла. Останавливается
      #    с кодом 2, если файл калькулятора рассчитан на другой год приёма, и
      #    с кодом 3, если у сверенной формулы изменился состав: в обоих
      #    случаях нужен человек, письмо об упавшем прогоне — сигнал.
      - name: Строки приёма и формулы
        run: python src/lt_load_formulas.py --apply

      # if: always() — направления и цифры не зависят от формул: сбой
      # предыдущего шага не должен оставлять их без обновления.
      - name: Направления программ
        if: always()
        run: python src/lt_load_fields.py --apply

      # Цифр прошлого приёма (lt_load_admission_stats.py) здесь нет намеренно:
      # портал data.gov.lt серверу GitHub не отвечает — два прогона 2026-10-09
      # кончились отказом и ошибкой 500. Набор обновляется раз в год, загрузчик
      # запускается с компьютера владельца (pipeline/README.md, годовой
      # календарь, строка «сентябрь»).

      # 3. Показатели выпускников: PDF лежит в репозитории, сеть не нужна.
      - name: Показатели выпускников
        if: always()
        run: python src/lt_load_field_outcomes.py --apply
