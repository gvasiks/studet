name: Backup

# План 2026-09-21, неделя 1, пункт 06. Самое дорогое в проекте — не код
# (он в git), а часы владельца, потраченные на подтверждение фактов через
# Supabase Studio. На бесплатном тарифе у Supabase нет ежедневных резервных
# копий. Два независимых слоя:
#
# 1. snapshot-verified — узкий JSON только с ПОДТВЕРЖДЁННЫМИ фактами
#    (formula/application_round/university_admission_type/programme_field/
#    programme_requirement_set/application_channel с verified_at)
#    коммитится прямо в репозиторий: подтверждения живут
#    в истории git и переживают полную потерю базы без какого-либо
#    восстановления БД вообще (pipeline/src/backup_verified.py).
# 2. full-dump — полный дамп схемы public (весь каталог, включая ещё не
#    подтверждённые черновики) через pg_dump уходит в артефакт прогона,
#    не в git: он больше и может быстро устареть, поэтому не тот случай,
#    где нужна история версий. Артефакт зашифрован фразой из секрета
#    BACKUP_PASSPHRASE: репозиторий публичный (проверка безопасности
#    2026-11-16).
#
# Раз в квартал стоит вручную развернуть дамп или снимок на чистый проект
# и убедиться, что это действительно работает (копия, которую ни разу не
# разворачивали, копией не является) — это отдельная ручная задача,
# не автоматизирована здесь.
on:
  schedule:
    # понедельник 03:00 UTC — через два часа после недельного сбора
    # каталога (01:00 UTC, .github/workflows/scrape-catalog.yml, тайм-аут
    # 120 минут), чтобы дамп заодно захватывал каталог этой недели
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

# Права токена GitHub заданы явно: без этой строки они зависят от настроек
# репозитория и могут оказаться шире нужного (аудит 2026-10-04).
permissions:
  contents: read

jobs:
  snapshot-verified:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install supabase~=2.31 python-dotenv~=1.2

      - run: python src/backup_verified.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Закоммитить снимок, если он изменился
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../docs/backups/verified-facts.json
          git diff --cached --quiet && echo "без изменений" || git commit -m "Snapshot verified facts ($(date -u +%F))"
          git push

  full-dump:
    runs-on: ubuntu-latest
    steps:
      # Секрет передаётся переменной окружения, а не подставляется в текст
      # команды: подстановка `${{ secrets… }}` вписывает значение прямо в
      # скрипт шага (аудит 2026-10-04).
      - name: Проверить наличие секрета SUPABASE_DB_URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL не задан (Settings -> Secrets and variables -> Actions)."
            echo "Формат: строка подключения Postgres из дэшборда Supabase — кнопка Connect ->"
            echo "Session pooler (адрес *.pooler.supabase.com), с паролем внутри. НЕ Direct connection:"
            echo "db.<проект>.supabase.co отвечает только по IPv6, а у серверов GitHub его нет."
            echo "Без него полный дамп не снимается; снимок подтверждённых фактов (соседняя работа"
            echo "этого workflow) продолжает идти независимо."
            exit 1
          fi

      # Проверка ДО дампа: без фразы дамп нельзя выкладывать (см. шаг
      # «Зашифровать дамп»), поэтому незачем его и снимать.
      - name: Проверить наличие секрета BACKUP_PASSPHRASE
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE не задан (Settings -> Secrets and variables -> Actions)."
            echo "Это парольная фраза, которой шифруется дамп: репозиторий публичный, и"
            echo "нешифрованный артефакт скачал бы любой вошедший пользователь GitHub."
            echo "Фразу сохранить и в менеджер паролей: без неё копию не развернуть."
            exit 1
          fi

      - name: Установить postgresql-client, если его нет
        run: command -v pg_dump || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Адрес — Session pooler, не прямое подключение: прямое (db.<проект>.supabase.co)
      # только IPv6, и с 2026-10-05 по 2026-11-16 каждый прогон падал с
      # «Network is unreachable» — копий базы за это время нет.
      # --schema=public: только наши таблицы, без служебных схем Supabase
      # (auth, storage, realtime), к которым у сервисного ключа нет прав
      # на дамп и которые нам не принадлежат
      - name: pg_dump схемы public
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges --format=custom \
            --file=studet-public-schema.dump

      # Репозиторий публичный: артефакт может скачать любой вошедший
      # пользователь GitHub, а в дампе есть закрытое от публичного ключа —
      # verified_by, disputed_reason, source_copy_*, черновики (проверка
      # безопасности 2026-11-16, находка 1). Поэтому наружу уходит только
      # зашифрованный файл. gpg уже стоит на серверах GitHub; фраза читается
      # со стандартного ввода, а не из аргумента — так её не видно в списке
      # процессов. Расшифровать: docs/backups/README.md, «Полный дамп».
      - name: Зашифровать дамп
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output studet-public-schema.dump.gpg studet-public-schema.dump
          rm studet-public-schema.dump

      - uses: actions/upload-artifact@v4
        with:
          name: studet-db-dump-${{ github.run_id }}
          path: studet-public-schema.dump.gpg
          # нет файла — ошибка, а не тихий пустой артефакт
          if-no-files-found: error
          # 14 дней вместо 90 (решение владельца 2026-10-10): репозиторий
          # публичный, а артефакт публичного репозитория может скачать любой
          # вошедший пользователь GitHub. Копия еженедельная, так что под
          # рукой остаются две последние.
          retention-days: 14
