name: Scrape catalog

on:
  schedule:
    # ночью по Риге (03:00–04:00), не в рабочие часы вузов — вежливый
    # обход, ревизия 2026-09, пункт 04
    - cron: "0 1 * * 1" # каждый понедельник в 01:00 UTC
  workflow_dispatch: {}

# Недельный сбор каталога и месячное обогащение пишут в одни и те же строки
# programme. 2-е число иногда выпадает на понедельник (2026-11-02,
# 2027-08-02), и тогда они шли бы одновременно. Общая группа ставит второй
# в очередь; cancel-in-progress: false — идущий прогон не прерывается.
concurrency:
  group: latvian-catalog-writes
  cancel-in-progress: false

# Права токена GitHub заданы явно: без этой строки они зависят от настроек
# репозитория и могут оказаться шире нужного (аудит 2026-10-04).
permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # паузы между страницами (1,5 с; у niid.lv 10 с) делают полный прогон
    # долгим — по оценке до часа
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      # --skip-local: rtu.lv и lma.lv не отдают программы серверу GitHub
      # (pipeline/src/scrape_scope.py) — их источники владелец собирает
      # локально, напоминает об этом local-scrape-reminder.yml
      - run: python src/main.py --skip-local
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # публичный контакт для User-Agent: URL страницы о проекте или почта.
          # Это variable (Settings -> Secrets and variables -> Actions ->
          # Variables), не secret: контакт должен быть виден администраторам
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
