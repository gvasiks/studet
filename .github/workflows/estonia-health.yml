name: "Estonia data health check"

# Сторож эстонских данных (docs/PLAN-ESTONIA.md, фаза 12). Сам ничего не
# собирает: раз в день смотрит, когда обновлялись эстонский каталог,
# направления программ и сроки приёма, и ПАДАЕТ, если что-то из этого старше
# 45 дней (pipeline/src/check_ee_sources.py). Упавший запланированный
# workflow GitHub присылает письмо — это и есть сигнал; название workflow
# попадает в тему письма.
#
# Зачем отдельно от самого сбора: сбор может не просто упасть, а перестать
# запускаться — GitHub отключает расписания в репозитории, где 60 дней не
# было активности.
on:
  schedule:
    # 07:00 UTC ежедневно — после латвийских (06:00, 06:30) и литовского
    # (06:45) сторожей
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# Права токена GitHub заданы явно: без этой строки они зависят от настроек
# репозитория и могут оказаться шире нужного (аудит 2026-10-04).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Только клиент базы, без Playwright — как у lithuania-health.yml
      - run: pip install supabase~=2.31 python-dotenv~=1.2

      - run: python src/check_ee_sources.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
