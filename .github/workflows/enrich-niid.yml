name: Enrich programme details (NIID, LU, university sites)

# Диплом, квалификация, описание и срок аккредитации — со страниц программ
# в NIID.lv (pipeline/src/enrich_niid_details.py). Отдельно от еженедельного
# сбора: у niid.lv пауза 10 секунд между страницами — на 242 страницы это
# 40 минут одного ожидания (замер 2026-10-03: 2375 с) плюс загрузка самих
# страниц, а меняются эти сведения редко. Раз в месяц достаточно;
# скрипт сам пропускает страницы, прочитанные меньше 30 дней назад.
on:
  schedule:
    # 2-е число каждого месяца, 02:30 UTC — ночь по Риге, не в понедельник,
    # когда идёт сбор каталога
    - cron: "30 2 2 * *"
  workflow_dispatch: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      # Сначала — найти страницу NIID для программ, собранных с сайтов вузов
      # (по латышскому названию и уровню; новые программы РТУ появляются
      # между обходами). Потом — прочитать страницы.
      - run: python src/match_niid_by_name.py --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}

      - run: python src/enrich_niid_details.py --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}

      # ЛУ: степень и описание — с английских страниц программ на lu.lv
      # (у программ ЛУ нет латышских названий, найти их в NIID нельзя).
      # if: always() — сбой обхода NIID не должен отменять обход ЛУ.
      - if: always()
        run: python src/enrich_lu_details.py --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}

      # Остальные вузы с английскими страницами программ (сейчас RSU).
      # --skip-local: lma.lv не отвечает серверу GitHub — LMA владелец
      # заполняет локально: python src/enrich_site_details.py --local --apply
      - if: always()
        run: python src/enrich_site_details.py --apply --skip-local
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
